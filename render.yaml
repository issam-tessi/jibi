# Render Blueprint — deploys the Expo web build as a static site.
# Setup: Render dashboard > New > Blueprint > pick this repo.
# You'll be prompted once for the two EXPO_PUBLIC_* values (same as your local .env).
# EXPO_PUBLIC_* vars are inlined at build time, so trigger a redeploy after changing them.
# Node version comes from .node-version.
services:
  - type: web
    runtime: static
    name: jibi-web
    branch: main
    buildCommand: npm ci && npm run build:web
    staticPublishPath: ./dist
    envVars:
      - key: EXPO_PUBLIC_SUPABASE_URL
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
    # Single-page app: let the client-side router handle every path.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Cross-origin isolation: required for on-device SQLite (expo-sqlite web uses SharedArrayBuffer).
      # require-corp rather than credentialless because Safari doesn't support credentialless.
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: require-corp
      - path: /_expo/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
